name: Build CineStream JVM desktop runtime

on:
  push:
    branches: [cinestream-jvm]
    paths:
      - 'RuntimeBridges/Desktop/**'
      - '.github/workflows/build-debflix-desktop-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cinestream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Checkout pinned CSX source and compile it normally
        run: |
          git clone https://github.com/SaurabhKaperwan/CSX.git /tmp/csx
          git -C /tmp/csx checkout 3bd036dee10fc4f7cf364ed3d50e6cf71563b4c0
          cat > /tmp/csx/local.properties <<'EOF'
          SIMKL_API=
          TMDB_KEY=
          CASTLE_KEY=
          MOVIEBLAST_TOKEN=
          MOVIEBLAST_API=
          MOVIEBLAST_KEY=
          EOF
          # The upstream models are passed to CloudStream's kotlinx parseJson helper
          # but lack the serializer marker needed by a JVM plugin JAR.
          sed -i '/^package com.megix$/a import kotlinx.serialization.Serializable' /tmp/csx/CineStream/src/main/kotlin/com/megix/CineTmdbProvider.kt
          sed -i '/^    data class LinkData(/i\    @Serializable' /tmp/csx/CineStream/src/main/kotlin/com/megix/CineTmdbProvider.kt
          sed -i '/^package com.megix$/a import kotlinx.serialization.Serializable' /tmp/csx/CineStream/src/main/kotlin/com/megix/CineSimklProvider.kt
          sed -i '/^    data class SimklResponse(/i\    @Serializable' /tmp/csx/CineStream/src/main/kotlin/com/megix/CineSimklProvider.kt
          chmod +x /tmp/csx/gradlew
          cd /tmp/csx
          sed -i -e 's/JvmTarget.JVM_1_8/JvmTarget.JVM_11/' -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_11/g' build.gradle.kts
          ./gradlew :CineStream:assembleDebug --no-daemon
      - name: Package source-compiled JVM classes as CineStream plugin
        run: |
          mkdir -p /tmp/cinestream-plugin RuntimeBridges/Desktop/build
          unzip -p /tmp/csx/CineStream/build/outputs/aar/CineStream-debug.aar classes.jar > RuntimeBridges/Desktop/build/cinestream-desktop.jar
          cat > /tmp/cinestream-plugin/manifest.json <<'EOF'
          {"name":"CineStream Desktop","pluginClassName":"com.megix.CineStream","version":487,"requiresResources":false,"tvTypes":["TvSeries","Movie","AsianDrama","Anime","Torrent"]}
          EOF
          jar uf RuntimeBridges/Desktop/build/cinestream-desktop.jar -C /tmp/cinestream-plugin manifest.json
      - name: Build isolated desktop runtime
        working-directory: RuntimeBridges/Desktop
        run: gradle shadowJar --no-daemon
      - name: Verify generated serialization support
        run: jar tf RuntimeBridges/Desktop/build/cinestream-desktop.jar | grep -E 'CineTmdbProvider.*LinkData.*serializer'
      - name: Exercise isolated CineStream registration and direct LinkData route
        working-directory: RuntimeBridges/Desktop
        run: |
          mkdir -p /tmp/cinestream-runtime
          cp build/cinestream-desktop.jar /tmp/cinestream-runtime/CineStream.jar
          cat > /tmp/cinestream-requests.jsonl <<'EOF'
          {"id":"load","method":"csLoadExtensions","args":{"folderPath":"/tmp/cinestream-runtime"}}
          {"id":"diag","method":"csGetDiagnostic","args":{}}
          {"id":"links","method":"csGetVideoList","args":{"sourceId":"cs_cinetmdb","url":"{\"id\":346364,\"imdbId\":\"tt15639572\",\"type\":\"movie\",\"title\":\"Backrooms\",\"year\":2026}"}}
          EOF
          timeout 150s java -jar build/libs/desktop_bridge.jar < /tmp/cinestream-requests.jsonl 2>&1 | tee /tmp/cinestream-runtime.log || test $? -eq 124
          grep -q 'CineStream' /tmp/cinestream-runtime.log
          grep -Eq 'provider-order: [1-9][0-9]* active' /tmp/cinestream-runtime.log
          grep -q '"id":"links"' /tmp/cinestream-runtime.log
      - uses: actions/upload-artifact@v4
        with:
          name: cinestream-jvm-runtime
          path: |
            RuntimeBridges/Desktop/build/libs/desktop_bridge.jar
            RuntimeBridges/Desktop/build/cinestream-desktop.jar
            /tmp/cinestream-runtime.log
          if-no-files-found: error
      - name: Publish test runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cinestream-jvm-${GITHUB_SHA}"
          gh release create "$TAG" \
            RuntimeBridges/Desktop/build/libs/desktop_bridge.jar \
            RuntimeBridges/Desktop/build/cinestream-desktop.jar \
            --prerelease --title "Debflix CineStream JVM test runtime" \
            --notes "Source-built from CSX 3bd036dee10fc4f7cf364ed3d50e6cf71563b4c0 with Kotlin serialization compiler support."
