name: Build Debflix desktop runtime\n# Rebuild corrected CineStream provider diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'RuntimeBridges/Desktop/**'
      - '.github/workflows/build-debflix-desktop-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build patched desktop bridge
        working-directory: RuntimeBridges/Desktop
        run: |
          set -o pipefail
          gradle shadowJar --no-daemon 2>&1 | tee /tmp/gradle.log || {
            ERR=$(grep -E "(e: |error:|FAILURE:)" /tmp/gradle.log | head -n 10 | tr '\n' ' ' | cut -c 1-500)
            echo "::error title=GradleError::$ERR"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: anymex-desktop-runtime-debflix
          path: RuntimeBridges/Desktop/build/libs/desktop_bridge.jar
          if-no-files-found: error
      - name: Publish immutable runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cine-stream-context-${GITHUB_SHA}"
          gh release create "$TAG" RuntimeBridges/Desktop/build/libs/desktop_bridge.jar \
            --title "Debflix CineStream desktop runtime" \
            --notes "Initializes CloudStream DataStore and application context before extension loading."